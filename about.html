<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Us</title>
  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0d0f17;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Glows */
    .glow-1, .glow-2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.6;
      animation: float 8s ease-in-out infinite alternate;
    }

    .glow-1 {
      width: 320px;
      height: 320px;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      top: 15%;
      left: 20%;
    }

    .glow-2 {
      width: 380px;
      height: 380px;
      background: linear-gradient(135deg, #3b82f6, #ec4899);
      bottom: 15%;
      right: 20%;
      animation-delay: -4s;
    }

    @keyframes float {
      0% {
        transform: translate(0, 0) scale(1);
      }
      100% {
        transform: translate(30px, -40px) scale(1.1);
      }
    }

    /* Glassmorphism Card Container */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 3rem 3.5rem;
      text-align: center;
      max-width: 480px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), 0 0 30px rgba(168, 85, 247, 0.2);
    }

    /* Subtitle Tag */
    .badge {
      display: inline-block;
      padding: 0.35rem 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #c084fc;
      background: rgba(168, 85, 247, 0.12);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 9999px;
    }

    /* Typography */
    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    /* Navigation Link Button */
    .btn {
      display: inline-block;
      padding: 0.75rem 1.75rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 12px;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .btn:hover {
      opacity: 0.9;
      transform: scale(1.03);
    }
  </style>
</head>
<body>

  <!-- Background Orbs -->
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <!-- Main Content Card -->
  <main class="card">
    <span class="badge">About Page</span>
    <h1>Who We Are</h1>
    <p>This page was built as part of a clean, multi-page HTML project with modern styling and responsive design.</p>
    <a href="index.html" class="btn">← Back to Home</a>
  </main>

</body>
</html>
